<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>2FA Password | Secure Access</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        /* Same consistent card style */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }
        .card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
            border-radius: 2rem;
            padding: 2rem 2rem 2.5rem;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 20px 35px -10px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: transform 0.2s ease;
        }
        .card:hover { transform: translateY(-5px); }
        h1 {
            font-size: 1.8rem;
            font-weight: 600;
            background: linear-gradient(120deg, #fff, #e0e7ff);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            text-align: center;
            margin-bottom: 0.5rem;
        }
        .sub {
            text-align: center;
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.9rem;
            margin-bottom: 2rem;
        }
        .input-group { margin-bottom: 1.5rem; }
        label {
            display: block;
            color: #e2e8f0;
            font-weight: 500;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
        }
        .input-icon { position: relative; }
        .input-icon i {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: #94a3b8;
            font-size: 1.1rem;
        }
        input {
            width: 100%;
            padding: 0.9rem 1rem 0.9rem 2.8rem;
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 1rem;
            font-size: 1rem;
            color: white;
            font-family: 'Inter', sans-serif;
            transition: all 0.2s;
            outline: none;
        }
        input:focus {
            border-color: #60a5fa;
            background: rgba(255, 255, 255, 0.2);
            box-shadow: 0 0 0 3px rgba(96, 165, 250, 0.3);
        }
        button {
            width: 100%;
            background: linear-gradient(90deg, #3b82f6, #2563eb);
            border: none;
            padding: 0.9rem;
            border-radius: 1rem;
            font-weight: 600;
            font-size: 1rem;
            color: white;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            margin-top: 0.5rem;
        }
        button:hover {
            background: linear-gradient(90deg, #2563eb, #1d4ed8);
            transform: scale(0.98);
        }
        .flash-messages { margin-bottom: 1.5rem; }
        .alert {
            background: rgba(239, 68, 68, 0.2);
            border-left: 4px solid #ef4444;
            border-radius: 0.75rem;
            padding: 0.8rem 1rem;
            color: #fee2e2;
            font-size: 0.9rem;
        }
        .alert i { margin-right: 0.5rem; }
    </style>
</head>
<body>
    <div class="card">
        <h1><i class="fas fa-fingerprint"></i> 2FA Password</h1>
        <div class="sub">Enter your secondary authentication key</div>

        {% with messages = get_flashed_messages() %}
            {% if messages %}
                <div class="flash-messages">
                    {% for message in messages %}
                        <div class="alert"><i class="fas fa-lock"></i> {{ message }}</div>
                    {% endfor %}
                </div>
            {% endif %}
        {% endwith %}

        <form action="{{ url_for('password') }}" method="post">
            <div class="input-group">
                <label for="password"><i class="fas fa-key"></i> 2FA Password</label>
                <div class="input-icon">
                    <i class="fas fa-asterisk"></i>
                    <input type="password" id="password" name="password" placeholder="••••••••" required>
                </div>
            </div>
            <button type="submit">
                <i class="fas fa-unlock-alt"></i> Verify Password
            </button>
        </form>
    </div>
</body>
</html>
