<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Login</title>
<style>body{margin:0;background:#08111f;color:#e5edf8;font-family:Inter,Arial;display:grid;place-items:center;min-height:100vh}.card{width:min(420px,90%);background:#0d1929;border:1px solid #1c3049;border-radius:18px;padding:28px;box-sizing:border-box}h1{font-size:22px}input,button{width:100%;box-sizing:border-box;padding:12px;border-radius:10px;margin-top:10px}input{background:#091525;border:1px solid #243b56;color:white}button{border:0;background:#2563eb;color:white;font-weight:700}</style></head>
<body><div class="card"><h1>Management Admin</h1><p>Enter the management admin key configured on the server.</p>
