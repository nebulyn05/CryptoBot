<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CryptoBot Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>*{box-sizing:border-box}body{margin:0;background:#07111e;color:#e5edf8;font-family:Inter,sans-serif}.shell{max-width:1350px;margin:auto;padding:28px 16px}.top{display:flex;justify-content:space-between;gap:20px;align-items:center;margin-bottom:20px}h1{margin:0;font-size:25px}.muted{color:#8296ae;font-size:12px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:16px}.card{background:#0c1828;border:1px solid #1c3048;border-radius:16px;padding:18px}.stat{font-size:27px;font-weight:800;margin-top:7px}.users{display:grid;gap:14px}.user{background:#0c1828;border:1px solid #1c3048;border-radius:16px;overflow:hidden}.userhead{padding:16px;display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:12px;align-items:center}.name{font-weight:800}.pill{padding:5px 8px;border-radius:999px;background:#14283e;font-size:11px;display:inline-block}.on{background:#0c3325;color:#7cf0ae}.off{background:#32171b;color:#fca5a5}.body{border-top:1px solid #1c3048;padding:16px;display:grid;grid-template-columns:1fr 1fr;gap:16px}.list{max-height:280px;overflow:auto}.item{padding:10px;border-bottom:1px solid #1b2d43;font-size:12px}.ca{font-family:monospace;color:#7f9ab7;word-break:break-all}.search{width:100%;padding:12px;background:#091525;border:1px solid #243b56;color:white;border-radius:10px;margin-bottom:16px}@media(max-width:850px){.grid{grid-template-columns:1fr 1fr}.userhead,.body{grid-template-columns:1fr}}@media(max-width:500px){.grid{grid-template-columns:1fr}}</style></head>
<body><div class="shell"><div class="top"><div><h1>CryptoBot Management</h1><div class="muted">Users, monitored groups, configured bots and captured signals.</div></div><a href="{{ url_for('admin_logout') }}" style="color:#93c5fd">Sign out</a></div>
<input id="search" class="search" placeholder="Search users, phones or bots..." oninput="render()"><div id="stats" class="grid"></div><div id="users" class="users"></div></div>
<script>
let data={{ overview|tojson }};
function esc(v){const d=document.createElement('div');d.textContent=v??'';return d.innerHTML}
function render(){const s=data.stats||{};document.getElementById('stats').innerHTML=[['Users',s.users],['Active users',s.active_users],['Monitored groups',s.monitored_groups],['Captured signals',s.signals]].map(x=>'<div class="card"><div class="muted">'+x[0]+'</div><div class="stat">'+x[1]+'</div></div>').join('');
const q=document.getElementById('search').value.toLowerCase();const users=(data.users||[]).filter(u=>[u.phone,u.display_name,u.bot_username].join(' ').toLowerCase().includes(q));
document.getElementById('users').innerHTML=users.length?users.map(u=>'<div class="user"><div class="userhead"><div><div class="name">'+esc(u.display_name||u.phone)+'</div><div class="muted">'+esc(u.phone)+'</div></div><div><span class="pill '+(u.active?'on':'off')+'">'+(u.active?'Active':'Inactive')+'</span></div><div><span class="pill">@'+esc(u.bot_username)+'</span></div><div class="muted">'+(u.last_seen?new Date(u.last_seen).toLocaleString():'—')+'</div></div><div class="body"><div><b>Monitored groups</b><div class="list">'+(u.groups.filter(g=>g.monitored).map(g=>'<div class="item"><b>'+esc(g.name)+'</b><div class="muted">'+esc(g.chat_id)+'</div></div>').join('')||'<div class="item muted">None</div>')+'</div></div><div><b>Captured signals</b><div class="list">'+(u.signals.slice(0,50).map(s=>'<div class="item"><b>'+esc(s.token)+'</b> — '+esc(s.source_chat_name||s.source_chat_id||'Unknown')+'<div class="ca">'+esc(s.contract_address)+'</div><div class="muted">'+new Date(s.captured_at).toLocaleString()+'</div></div>').join('')||'<div class="item muted">None</div>')+'</div></div></div></div>').join(''):'<div class="card">No users match the search.</div>'}
render();
</script></body></html>
