<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CryptoBot | Admin Management</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<style>
*{box-sizing:border-box}body{margin:0;background:#07111e;color:#e5edf8;font-family:Inter,sans-serif}.shell{max-width:1400px;margin:auto;padding:28px 16px 50px}
.top{display:flex;justify-content:space-between;gap:20px;align-items:center;margin-bottom:20px}h1{margin:0;font-size:25px}.muted{color:#8296ae;font-size:12px}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-bottom:16px}.card{background:#0c1828;border:1px solid #1c3048;border-radius:16px;padding:18px}.stat{font-size:27px;font-weight:800;margin-top:7px}
.search{width:100%;padding:12px;background:#091525;border:1px solid #243b56;color:white;border-radius:10px;margin-bottom:16px;outline:none}
.users{display:grid;gap:14px}.user{background:#0c1828;border:1px solid #1c3048;border-radius:16px;overflow:hidden}.userhead{padding:16px;display:grid;grid-template-columns:2fr 1fr 1fr 1.4fr;gap:12px;align-items:center}.name{font-weight:800}
.pill{padding:5px 8px;border-radius:999px;background:#14283e;font-size:11px;display:inline-block}.on{background:#0c3325;color:#7cf0ae}.off{background:#32171b;color:#fca5a5}
.body{border-top:1px solid #1c3048;padding:16px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px}.section{min-width:0}.list{max-height:300px;overflow:auto;margin-top:8px}.item{padding:10px;border-bottom:1px solid #1b2d43;font-size:12px}.ca{font-family:monospace;color:#7f9ab7;word-break:break-all}.botrow{display:flex;justify-content:space-between;gap:8px;align-items:center}.empty{padding:12px;color:#6f839b;font-size:12px}
@media(max-width:1050px){.grid{grid-template-columns:repeat(3,1fr)}.userhead,.body{grid-template-columns:1fr 1fr}}@media(max-width:650px){.grid{grid-template-columns:1fr 1fr}.userhead,.body{grid-template-columns:1fr}}@media(max-width:430px){.grid{grid-template-columns:1fr}}
</style></head>
<body><div class="shell">
<div class="top"><div><h1><i class="fas fa-shield-halved"></i> CryptoBot Management</h1><div class="muted">Administrative visibility into users, watched groups, bot profiles and captured signals.</div></div><a href="{{ url_for('admin_logout') }}" style="color:#93c5fd;text-decoration:none"><i class="fas fa-sign-out-alt"></i> Sign out</a></div>
<div id="stats" class="grid"></div>
<input id="search" class="search" placeholder="Search by user, phone, bot, group or token..." oninput="render()">
<div id="users" class="users"></div>
</div>
<script>
let data={{ overview|tojson }};
function esc(v){const d=document.createElement('div');d.textContent=v??'';return d.innerHTML}
function render(){
 const s=data.stats||{};
 document.getElementById('stats').innerHTML=[
  ['Users',s.users],['Active users',s.active_users],['Groups',s.groups],['Watched groups',s.monitored_groups],['Captured signals',s.signals]
 ].map(x=>'<div class="card"><div class="muted">'+x[0]+'</div><div class="stat">'+(x[1]??0)+'</div></div>').join('');
 const q=document.getElementById('search').value.toLowerCase().trim();
 const users=(data.users||[]).filter(u=>{
  const text=[u.phone,u.display_name,u.bot_username,...(u.groups||[]).map(g=>g.name),...(u.signals||[]).map(s=>s.token),...(u.bots||[]).map(b=>b.bot_username)].join(' ').toLowerCase();
  return text.includes(q);
 });
 document.getElementById('users').innerHTML=users.length?users.map(u=>{
  const groups=(u.groups||[]).filter(g=>g.monitored), bots=u.bots||[], signals=u.signals||[];
  return '<div class="user"><div class="userhead"><div><div class="name">'+esc(u.display_name||u.phone)+'</div><div class="muted">'+esc(u.phone)+'</div></div><div><span class="pill '+(u.active?'on':'off')+'">'+(u.active?'Active':'Inactive')+'</span></div><div><span class="pill">'+(bots.length)+' bot profile'+(bots.length===1?'':'s')+'</span></div><div class="muted">Selected: @'+esc(u.bot_username||'—')+'<br>'+ (u.last_seen?'Seen '+new Date(u.last_seen).toLocaleString():'No activity')+'</div></div><div class="body">'+
  '<div class="section"><b><i class="fas fa-eye"></i> Watched Groups ('+groups.length+')</b><div class="list">'+(groups.length?groups.map(g=>'<div class="item"><b>'+esc(g.name)+'</b><div class="muted">'+esc(g.chat_id)+'</div><button style="margin-top:7px" onclick="toggleGroup('+g.id+',false)">Unwatch</button> <button style="margin-top:7px;background:#7f1d1d" onclick="deleteGroup('+g.id+')">Delete</button></div>').join(''):'<div class="empty">None</div>')+'</div></div>'+
  '<div class="section"><b><i class="fas fa-robot"></i> Bot Profiles</b><div class="list">'+(bots.length?bots.map(b=>'<div class="item"><div class="botrow"><span>'+esc(b.label||b.bot_username)+'</span>'+(b.selected?'<span class="pill on">Selected</span>':'')+'</div><div class="muted">@'+esc(b.bot_username)+(b.enabled?'':' · disabled')+'</div><button style="margin-top:7px" onclick="toggleBot('+b.id+','+(!b.enabled)+')">'+(b.enabled?'Disable':'Enable')+'</button> <button style="margin-top:7px;background:#7f1d1d" onclick="deleteBot('+b.id+')">Delete</button></div>').join(''):'<div class="empty">None</div>')+'</div></div>'+
  '<div class="section"><b><i class="fas fa-key"></i> Captured Signals ('+signals.length+')</b><div class="list">'+(signals.length?signals.slice(0,100).map(s=>'<div class="item"><b>'+esc(s.token)+'</b><div class="ca">'+esc(s.contract_address||'—')+'</div><div class="muted">'+esc(s.source_chat_name||s.source_chat_id||'Unknown source')+' · '+new Date(s.captured_at).toLocaleString()+'</div><details style="margin-top:7px"><summary style="cursor:pointer;color:#93c5fd">Raw message</summary><div style="white-space:pre-wrap;margin-top:6px;color:#a9bad0">'+esc(s.raw_message||'Not stored')+'</div></details></div>').join(''):'<div class="empty">None</div>')+'</div></div>'+
 '</div></div>';
 }).join(''):'<div class="card">No users match the search.</div>';
}
async function adminCall(url,method,body){const r=await fetch(url,{method,headers:{'Content-Type':'application/json','X-CSRF-Token':document.querySelector('meta[name=csrf-token]').content},body:body?JSON.stringify(body):undefined});const d=await r.json();if(!r.ok)throw new Error(d.error||'Request failed');data=d;render()}
async function toggleUser(id,active){try{await adminCall('/admin/api/users/'+id+'/status','POST',{active});}catch(e){alert(e.message)}}
async function deleteUser(id){if(!confirm('Delete this user and all management records?'))return;try{await adminCall('/admin/api/users/'+id,'DELETE')}catch(e){alert(e.message)}}
async function toggleGroup(id,monitored){try{await adminCall('/admin/api/groups/'+id+'/status','POST',{monitored});}catch(e){alert(e.message)}}
async function deleteGroup(id){if(!confirm('Delete this group record?'))return;try{await adminCall('/admin/api/groups/'+id,'DELETE')}catch(e){alert(e.message)}}
async function toggleBot(id,enabled){try{await adminCall('/admin/api/bots/'+id,'PATCH',{enabled});}catch(e){alert(e.message)}}
async function deleteBot(id){if(!confirm('Delete this bot profile?'))return;try{await adminCall('/admin/api/bots/'+id,'DELETE')}catch(e){alert(e.message)}}
setInterval(async()=>{try{const r=await fetch('/admin/management');if(r.ok){data=await r.json();render()}}catch(e){}},15000);
render();
</script></body></html>
